name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skincare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Basic static checks (syntax compile)
        run: python -m py_compile $(find app -name "*.py")

      - name: Run migrations against test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skincare_test
        run: |
          python -c "
          from alembic.config import Config
          from alembic import command
          cfg = Config('alembic.ini')
          cfg.set_main_option('sqlalchemy.url', 'postgresql://postgres:postgres@localhost:5432/skincare_test')
          command.upgrade(cfg, 'head')
          "

      - name: Run test suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skincare_test
          REDIS_URL: redis://localhost:6379/1
          JWT_SECRET: ci-only-secret-never-used-outside-github-actions-0123456789ab
        run: python -m pytest tests/ -v

  dependency-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: pip-audit (known-CVE scan of production dependencies -- release gate)
        run: |
          python -m pip install --upgrade pip pip-audit
          # --ignore-vuln entries are per-CVE-justified exceptions only,
          # never blanket -- see SECURITY_VULNERABILITY_STATUS.md and
          # CI_SECURITY_RECONCILIATION.md for the full writeup, and
          # backend/.trivyignore for the equivalent Trivy-side exception.
          # PYSEC-2026-1805 / CVE-2026-0994 (protobuf): a JSON-parsing
          # recursion-depth DoS not reachable through anything this app
          # does with protobuf; fixing it requires a mediapipe version
          # that dropped the legacy `mediapipe.solutions` API this app's
          # CV pipeline depends on. Review by 2026-12-09.
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1805

      - name: pip-audit (dev/test dependencies -- informational, not a release gate)
        continue-on-error: true
        run: pip-audit -r requirements-dev.txt --ignore-vuln PYSEC-2026-1805

  docker-build-and-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build -t skincare-app-backend:${{ github.sha }} .

      # Gating scan: fails the build on any HIGH/CRITICAL finding that
      # has an available fix. This is the actual release gate.
      - name: Trivy container scan (gating -- fixable HIGH/CRITICAL only)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: skincare-app-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          # Per-entry justified ignores only -- see backend/.trivyignore
          # and SECURITY_VULNERABILITY_STATUS.md for why each entry is
          # here. Not used by the full-report scan below, so an ignored
          # finding still shows up there instead of disappearing.
          trivyignores: backend/.trivyignore

      # Full report: every HIGH/CRITICAL finding, including unfixed
      # upstream OS issues the gating scan above deliberately excludes.
      # Never gates the build -- its only job is to keep those findings
      # visible instead of silently dropped. See
      # SECURITY_VULNERABILITY_STATUS.md for the tracked/justified list.
      - name: Trivy container scan (full report -- includes unfixed, non-gating)
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: skincare-app-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"
